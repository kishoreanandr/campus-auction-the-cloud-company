spring.application.name=backend

spring.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/campus_auction
spring.datasource.username=root
spring.datasource.password=Kishore@04

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Set all three values to provision the initial administrator account.
app.admin.name=${ADMIN_NAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}


# Listing image storage
app.upload.dir=uploads/listings
app.upload.max-file-size=5MB
app.upload.max-images-per-listing=5

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB